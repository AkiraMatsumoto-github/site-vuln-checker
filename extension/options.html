<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サイト脆弱性チェッカー — 設定</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options">
    <h1>設定</h1>

    <section>
      <h2>脆弱性索引（advisories.json）</h2>
      <p class="empty">
        照合に使う索引の URL を指定します。索引は<strong>端末内に保存</strong>し、閲覧した URL は
        どこにも送りません。
      </p>
      <label for="url">索引の URL</label>
      <input id="url" type="url" placeholder="https://example.com/svc/advisories.json" />
      <div class="actions">
        <button id="save" type="button">保存して読み込む</button>
        <button id="refresh" type="button" class="secondary">今すぐ更新</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section>
      <h2>この拡張について</h2>
      <ul class="notes">
        <li>調べるのは<b>いま開いているタブ 1 枚</b>だけです（既定では追加のリクエストを送りません。許可したサイトだけ、PHP の版を読むために HEAD を 1 回送ります）。</li>
        <li>判定は公開情報に基づく<b>推定</b>で、安全性を保証するものではありません。</li>
        <li>API キーなどの秘密情報は持ちません。</li>
      </ul>
    </section>

    <script type="module" src="options.js"></script>
  </body>
</html>
