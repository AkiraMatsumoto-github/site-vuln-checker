<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サイト脆弱性チェッカー</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>サイト脆弱性チェッカー</h1>
      <p id="target" class="target">タブを選んで「このサイトを調べる」を押してください。</p>
      <div class="actions">
        <button id="inspect" type="button">このサイトを調べる</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </header>

    <section class="versions">
      <h2>バージョンを入力（任意）</h2>
      <p class="hint">
        外からは分からない PHP やフレームワークの版を入れると、サポート終了と脆弱性を判定できます。
      </p>
      <div class="row">
        <select id="product" aria-label="製品">
          <option value="php">PHP</option>
          <option value="wordpress">WordPress</option>
          <option value="laravel">Laravel</option>
          <option value="symfony">Symfony</option>
          <option value="codeigniter">CodeIgniter</option>
          <option value="cakephp">CakePHP</option>
          <option value="django">Django</option>
          <option value="rails">Ruby on Rails</option>
        </select>
        <input id="version" type="text" inputmode="text" placeholder="8.1.27" aria-label="バージョン" />
        <button id="addVersion" type="button">追加</button>
      </div>
      <ul id="versionList" class="chips"></ul>
      <p class="hint">
        サイトが PHP の版を公開している場合だけ読めます（実測 10%）。初回のチェック時に、このサイトへの
        アクセス許可を求めます（拒否しても判定できます）。
        <button id="grantHeaders" type="button" class="link" hidden>もう一度許可を求める</button>
      </p>
    </section>

    <main id="result" hidden>
      <section>
        <h2>更新すべきもの</h2>
        <div id="judgements"></div>
      </section>

      <section>
        <h2>構成（検出できたもの）</h2>
        <div id="components"></div>
      </section>

      <section id="unknownSection" hidden>
        <h2>判定できなかったこと</h2>
        <ul id="unknown"></ul>
      </section>

      <footer>
        <p>判定は公開情報に基づく<strong>推定</strong>です。安全性を保証するものではありません。</p>
        <p id="meta" class="meta"></p>
      </footer>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
