name: 索引の公開

# 索引（advisories.json）を毎日作り直して **GitHub Pages** に置く（拡張はここを読む）。
# Releases にも同じファイルを置く（手元で落としたい人・履歴用）。

on:
  workflow_dispatch:
    inputs:
      full:
        description: "前回の索引を使わず、フルで作り直す"
        type: boolean
        default: false
      products:
        description: "CPE の対象製品（カンマ区切り）"
        type: string
        default: "php,wordpress,laravel,symfony,cakephp,django,rails,jekyll"
  schedule:
    # 毎日 18:00 UTC（日本時間 03:00）
    - cron: "0 18 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# 実行が重ならないようにする（前の実行は止めない）
concurrency:
  group: publish-index
  cancel-in-progress: false

env:
  INDEX_PATH: out/advisories.json
  TAG: index

jobs:
  publish:
    name: ビルドと公開
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: NVD の API キー確認
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "::warning::NVD_API_KEY が未設定です（レート制限で非常に遅くなります）"
          else
            echo "NVD_API_KEY: 設定済み"
          fi

      - name: 前回の索引を取得（差分更新の土台）
        if: ${{ inputs.full != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern advisories.json --dir out --clobber || true
          fi
          if [ -f "$INDEX_PATH" ]; then
            echo "前回の索引: $(python -c "import json;print(len(json.load(open('$INDEX_PATH'))['advisories']))") 件"
          else
            echo "前回の索引なし（今回フルで作る）"
          fi

      - name: 索引を作る（前回があれば直近 14 日だけ足す）
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -f "$INDEX_PATH" ]; then
            uv run svc-ingest --days 14 --merge --out "$INDEX_PATH"
          else
            uv run svc-ingest --out "$INDEX_PATH"
          fi
          # CPE（PHP 本体・フレームワーク・静的サイト）は毎回取り直して足す。
          # ここを初回だけにすると、後から対象製品を増やしても反映されない。
          uv run svc-ingest --source cpe \
            --products "${{ inputs.products || 'php,wordpress,laravel,symfony,cakephp,django,rails,jekyll' }}" \
            --merge --out "$INDEX_PATH"

      - name: 悪用実績・悪用確率・EOL を足す
        run: |
          uv run svc-enrich --index "$INDEX_PATH"
          uv run svc-eol --out "$INDEX_PATH"

      - name: 検証（空でない・PHP 本体が入っている）
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("out/advisories.json").read_text(encoding="utf-8"))
          advisories = data.get("advisories") or []
          php = [a for a in advisories if a.get("slug") == "php"]
          lifecycles = data.get("lifecycles") or {}
          print(f"勧告 {len(advisories)} 件 / PHP {len(php)} 件 / EOL {len(lifecycles.get('products', {}))} 製品")
          if len(advisories) < 1000:
              sys.exit("索引が小さすぎます（取り込みに失敗した可能性）")
          if not php:
              sys.exit("PHP 本体の勧告がありません（--source cpe が失敗した可能性）")
          if not lifecycles.get("products"):
              sys.exit("EOL 情報がありません")
          PY

      - name: Releases を更新（毎日の索引 + 日付つきの履歴）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DATED: "7"
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          DATED="advisories-$DATE.json"
          cp "$INDEX_PATH" "out/$DATED"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --latest \
              --title "脆弱性索引（自動更新）" \
              --notes "サイト脆弱性チェッカーが使う索引です。GitHub Actions が毎日更新します。"
          fi

          gh release upload "$TAG" "$INDEX_PATH" "out/$DATED" --clobber

          # 古い日付つきファイルは直近 KEEP_DATED 件だけ残す
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep -E '^advisories-[0-9]{8}\.json$' | sort -r | tail -n +$((KEEP_DATED + 1)) \
            | while read -r old; do
                echo "古い履歴を削除: $old"
                gh release delete-asset "$TAG" "$old" -y || true
              done

          SUMMARY=$(uv run python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("out/advisories.json").read_text(encoding="utf-8"))
          advisories = data.get("advisories") or []
          php = [a for a in advisories if a.get("slug") == "php"]
          products = (data.get("lifecycles") or {}).get("products") or {}
          print(f"勧告 {len(advisories)} 件 / PHP 本体 {len(php)} 件 / EOL {len(products)} 製品 / 生成 {data.get('generated_at')}")
          PY
          )
          gh release edit "$TAG" --latest --notes "更新: $(date -u '+%Y-%m-%d %H:%M UTC')

          $SUMMARY

          拡張は GitHub Pages の索引を読みます。ここには同じファイルと日付つきの履歴を置いています。"


      - name: Pages 用のファイルを用意
        run: |
          set -euo pipefail
          mkdir -p public
          cp "$INDEX_PATH" public/advisories.json
          # プライバシーポリシー（Chrome ウェブストアの「プライバシーポリシー URL」に指定する）
          cp docs/privacy.html public/privacy.html
          ls -l public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 公開後の確認（Pages / Releases の両方）
        run: |
          set -euo pipefail
          for url in \
            "https://akiramatsumoto-github.github.io/site-vuln-checker/advisories.json" \
            "https://akiramatsumoto-github.github.io/site-vuln-checker/privacy.html" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/advisories.json"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> HTTP $code"
            test "$code" = "200"
          done

      - name: 結果をまとめる
        if: always()
        run: |
          {
            echo "### 索引の公開結果"
            echo ""
            echo "- 拡張が読む索引: https://akiramatsumoto-github.github.io/site-vuln-checker/advisories.json"
            echo "- プライバシーポリシー: https://akiramatsumoto-github.github.io/site-vuln-checker/privacy.html"
            echo "- リリース（履歴つき）: https://github.com/${{ github.repository }}/releases/tag/index"
            echo "- 実行: ${{ github.event_name }}（フル再構築: ${{ inputs.full || false }}）"
          } >> "$GITHUB_STEP_SUMMARY"
