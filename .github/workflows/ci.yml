name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: 依存を同期（lock どおり）
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  extension:
    name: extension (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 構文チェック
        run: |
          for file in extension/*.js; do
            node --check "$file"
          done

      - name: 単体テスト（Python 版と同じフィクスチャ）
        run: node --test extension/tests/
